<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thematic Chronologies | Palquest</title>
<style>
@font-face { font-family: "Suisse Intl"; src: url("assets/fonts/SuisseIntl-Book.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Lyon Text"; src: url("assets/fonts/LyonArabicText-Regular-Web.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  color-scheme: light;
  --paper: #ffffff; --ink: #06281e; --grey: #a8a39f; --rule: #dbdbdb;
  --hl: #4ca487; --light: #c7d7cd; --soft: #e6f2ec;
  --f-display: "Lyon Text", Georgia, "Times New Roman", serif;
  --f-text: "Suisse Intl", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --hdr: 60px; --bar: 64px;
  --edge: max(16px, calc((100% - 1296px) / 2));
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-synthesis: none; background: var(--paper); color: var(--ink); font-family: var(--f-text); font-size: 16px; line-height: 20px; }
a { color: inherit; }
img { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; border-radius: 2px; }

/* ---------- Sticky header and secondary bar (Figma: navbar 60px, secondary bar 64px) ---------- */
.nav { position: sticky; top: 0; z-index: 30; height: var(--hdr); background: var(--paper); border-bottom: 1px solid var(--rule); }
.nav__in { height: 100%; margin: 0 var(--edge); display: flex; align-items: center; gap: 16px; }
.nav__logo img { height: 40px; width: auto; }
.nav__sp { flex: 1; }
.nav__btn { background: none; border: 0; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0; cursor: pointer; font-size: 16px; transition: color .2s var(--ease); }
.nav__btn:hover { color: var(--hl); }
.bar { position: sticky; top: var(--hdr); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar__in { margin: 0 var(--edge); height: var(--bar); display: flex; align-items: center; gap: 24px; padding: 8px 0; }
.bar__group { display: flex; align-items: center; gap: 8px; }
.bar__right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.lbl { font-size: 14px; letter-spacing: -.02em; white-space: nowrap; }
.search { width: 196px; height: 36px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 16px; font-size: 14px; background: var(--paper); }
.search::placeholder { color: var(--ink); opacity: .75; }
.search:focus { outline: 2px solid var(--hl); outline-offset: 1px; border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; padding: 2px; background: var(--paper); }
.seg__btn { border: 0; background: none; height: 32px; padding: 0 14px; border-radius: 4px; font-size: 14px; letter-spacing: -.02em; cursor: pointer; transition: background-color .2s var(--ease), color .2s var(--ease); }
.seg__btn:hover:not([aria-pressed="true"]) { background: var(--soft); }
.seg__btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.dd { height: 36px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; padding: 4px 32px 4px 16px; font-size: 14px; letter-spacing: -.02em; appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; transition: background-color .2s var(--ease); }
.dd:hover { background-color: #0d3d2e; }
.btn { height: 36px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; padding: 0 16px; font-size: 14px; letter-spacing: -.02em; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background-color .2s var(--ease); }
.btn:hover { background: var(--hl); }
.btn--ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.btn--ghost:hover { background: var(--soft); color: var(--ink); }

/* Years axis (Figma: 12px labels, thin tick line) */
.axis { margin: 0 var(--edge); position: relative; height: 32px; border-bottom: 1px solid var(--rule); font-size: 12px; }
.axis__lbl { position: absolute; bottom: 8px; transform: translateX(-50%); white-space: nowrap; font-feature-settings: "lnum" 1, "tnum" 1; }
.axis__tick { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--ink); }

/* ---------- Page head ---------- */
.head { margin: 0; padding: 40px var(--edge) 64px; display: grid; grid-template-columns: 5fr 7fr; column-gap: 24px; align-items: start; border-bottom: 1px solid var(--rule); }
.head .crumb { grid-column: 1 / -1; }
.crumb { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--grey); margin: 0 0 12px; }
.crumb a { text-decoration: none; transition: color .2s var(--ease); }
.crumb a:hover { color: var(--hl); text-decoration: underline; text-underline-offset: 3px; }
.head h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 3.8vw, 56px); line-height: 1; letter-spacing: -.01em; }
.head .lede { margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink); }

/* ---------- Periods ---------- */
/* Periods: compact rows, title left-aligned, dates on hover, timeline as a thin strip under each title */
.per__row { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; width: 100%; height: 64px; padding: 0 0 6px; cursor: pointer; position: relative; transition: background-color .3s var(--ease); }
.per__row:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }
.per__name { font-size: 28px; line-height: 1; white-space: nowrap; position: relative; z-index: 1; }
.per__dates { font-size: 16px; color: var(--grey); margin-left: 16px; opacity: 0; transform: translateX(-4px); display: inline-block; transition: opacity .3s var(--ease), transform .3s var(--ease); }
.per__row:hover .per__dates, .per__row:focus-visible .per__dates { opacity: 1; transform: none; }
.per__plus { font-size: 24px; line-height: 1; padding-right: 16px; transition: transform .35s var(--ease); }
.per__band { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; pointer-events: none; }
.per__band i { position: absolute; top: 0; bottom: 0; background: var(--hl); transition: background-color .3s var(--ease); }
.per__row:hover .per__band i { background: #3d9a78; }
.per[data-open="true"] .per__row { background: var(--light); }
.per[data-open="true"] .per__plus { transform: rotate(45deg); }
.per__row:hover { background: var(--soft); }
.per[data-open="true"] .per__row:hover { background: var(--light); }

.list { margin: 0 var(--edge); padding-bottom: 80px; }
.per { border-bottom: 1px solid var(--rule); }
.per__body { padding: 16px 0 24px; display: grid; grid-template-columns: minmax(0, 1fr) 506px; gap: 40px 140px; }
.per__body[hidden] { display: none; }
.per__text { padding-left: 0; }
.per__text p { margin: 0 0 20px; font-size: 18px; line-height: 20px; }
.per__read { display: inline-flex; align-items: center; height: 38px; padding: 4px 16px; border-radius: 6px; background: var(--ink); color: #fff; text-decoration: none; font-size: 16px; letter-spacing: -.02em; transition: background-color .2s var(--ease); }
.per__read:hover { background: var(--hl); }
.per__fig { margin: 0; }
.per__fig .frame { overflow: hidden; border-radius: 2px; aspect-ratio: 506 / 294; background: var(--soft); }
.per__fig img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.per__fig:hover img { transform: scale(1.04); }
.per__fig figcaption { font-size: 13px; line-height: 14px; margin-top: 8px; }
.per__fig figcaption .src { color: var(--grey); display: block; }
.per__events { grid-column: 1 / -1; }

/* ---------- Event rows (Figma: date 196px, title 856px, thumbnail 37px) ---------- */
.ev { all: unset; box-sizing: border-box; position: relative; display: grid; grid-template-columns: 196px minmax(0, 1fr) 37px; column-gap: 24px; align-items: center; width: 100%; min-height: 40px; padding: 8px 0; border-top: 1px solid var(--rule); cursor: pointer; overflow: hidden; transition: background-color .25s var(--ease); }
.ev:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }
.ev:hover { background: var(--soft); }
.ev__d { font-size: 16px; line-height: 20px; color: var(--grey); white-space: nowrap; transition: color .25s var(--ease); }
.ev__t { font-size: 16px; line-height: 20px; position: relative; z-index: 1; transition: transform .35s var(--ease), color .3s var(--ease); }
.ev__t::after { content: "→"; margin-left: 8px; color: var(--hl); opacity: 0; display: inline-block; transform: translateX(-6px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
.ev--main .ev__t { font-size: 24px; line-height: 1.1; }
.ev--xl .ev__t { font-size: 32px; line-height: 1.1; }
.ev:hover .ev__t { transform: translateX(6px); color: var(--hl); }
.ev:hover .ev__t::after { opacity: 1; transform: none; }
.ev:hover .ev__d { color: var(--ink); }
.ev__mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hl); pointer-events: none; transition: width .3s var(--ease), background-color .3s var(--ease); }
.ev:hover .ev__mark { width: 3px; background: #3d9a78; }
.ev__thumb { width: 37px; height: 37px; border-radius: 2px; overflow: hidden; background: var(--soft); position: relative; z-index: 1; }
.ev__thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.ev:hover .ev__thumb img { transform: scale(1.08); }

/* ---------- Side panels ---------- */
.panel { position: fixed; top: 0; right: 0; height: 100dvh; width: min(560px, 100%); background: var(--paper); z-index: 60; box-shadow: -16px 0 36px rgba(6, 40, 30, .12); transform: translateX(100%); transition: transform .4s var(--ease); overflow: auto; overscroll-behavior: contain; visibility: hidden; }
.panel.is-open { transform: none; visibility: visible; }
.panel__in { padding: 28px 40px 40px; }
.panel__top { display: flex; justify-content: flex-end; }
.panel__close { background: none; border: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; transition: color .2s var(--ease); }
.panel__close:hover { color: var(--hl); }
.filters h2 { font-weight: 400; font-size: 32px; line-height: 1.1; margin: 0 0 24px; }
.filters { width: min(1200px, calc(100% - 40px)); top: 27px; right: 20px; height: calc(100dvh - 54px); }
.filters .panel__in { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 24px 32px 32px; }
.filters h2 { font-size: 40px; }
.filters__grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 0; flex: 1; min-height: 0; overflow: auto; margin-top: 24px; }
.filters__grid > .fgroup { padding: 0 24px; border-left: 1px solid var(--rule); }
.filters__grid > .fgroup:first-child { padding-left: 0; border-left: 0; }
.fgroup ul.sub { padding-left: 24px; }
.fgroup h3 { font-size: 24px; font-weight: 400; color: var(--ink); margin: 0 0 12px; }
.fgroup ul { list-style: none; margin: 0; padding: 0; }
.fgroup label { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; transition: color .2s var(--ease); }
.fgroup label:hover { color: var(--hl); }
.fgroup input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
.fgroup .n { margin-left: auto; font-size: 12px; color: var(--grey); background: var(--soft); border-radius: 999px; padding: 1px 8px; }
.fgroup .all { color: var(--ink); text-transform: uppercase; font-size: 14px; letter-spacing: .02em; border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 4px; }
.filters__act { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); }
.evp__date { font-size: 14px; color: var(--grey); margin: 0 0 8px; }
.evp h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.15; margin: 0 0 24px; }
.meta { margin: 0; border-top: 1px solid var(--rule); }
.meta div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.meta dt { color: var(--grey); }
.meta dd { margin: 0; }
.meta dd a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); transition: color .2s var(--ease); }
.meta dd a:hover { color: var(--hl); text-decoration-color: var(--hl); }
.evp__text { margin: 24px 0; }
.evp__text p { margin: 0 0 12px; }
.evp h3 { font-size: 14px; font-weight: 400; color: var(--grey); margin: 28px 0 8px; }
.rel { display: block; padding: 12px 0; border-top: 1px solid var(--rule); text-decoration: none; transition: color .2s var(--ease); }
.rel:hover .rel__t, .evp__row:hover .evp__t, .evp__txt:hover .evp__t, .evp__place:hover .evp__t, .thm:hover .evp__t { color: var(--hl); text-decoration: underline; text-underline-offset: 3px; }
.evp__row:hover img, .thm:hover img { opacity: .85; }
.evp__row img, .thm img { transition: opacity .3s var(--ease); }
.evp__row, .evp__txt, .evp__place, .thm { color: inherit; text-decoration: none; cursor: pointer; }
.evp__t { transition: color .2s var(--ease); }
.rel__d { display: block; font-size: 14px; color: var(--grey); }
.rel--ic { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: center; }
.rel__ic { color: var(--ink); display: block; }
.rel__ic svg { display: block; }
.evp__row, .evp__txt, .evp__place { display: grid; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); align-items: start; }
.evp__row { grid-template-columns: 56px minmax(0, 1fr); }
.evp__row img { width: 56px; height: 56px; object-fit: cover; border-radius: 2px; display: block; }
.evp__txt { grid-template-columns: 120px minmax(0, 1fr); }
.evp__place { grid-template-columns: 80px minmax(0, 1fr); }
.evp__y, .evp__cat { font-size: 14px; color: var(--grey); display: block; }
.evp__cat { font-size: 12px; text-transform: uppercase; letter-spacing: .02em; padding-top: 2px; }
.evp__t { font-size: 14px; display: block; }
.evp__sub { font-size: 14px; color: var(--grey); display: block; margin-top: 4px; }
.thm { display: block; max-width: 352px; text-decoration: none; padding: 12px 0; }
.thm img { width: 100%; aspect-ratio: 5 / 3; object-fit: cover; display: block; margin-bottom: 8px; }
.thm .evp__y { margin-bottom: 2px; }
.hl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--rule); text-decoration: none; }
.hl img { width: 96px; height: 64px; object-fit: cover; border-radius: 2px; transition: transform .5s var(--ease); }
.hl:hover img { transform: scale(1.04); }
.hl:hover .hl__t { color: var(--hl); }
.hl__t { transition: color .2s var(--ease); }
.hl__s { display: block; font-size: 14px; color: var(--grey); margin-top: 4px; }
.evp__fig { display: grid; grid-template-columns: 289px minmax(0, 1fr); gap: 24px; margin: 24px 0; }
.evp__fig img { width: 289px; height: 288px; object-fit: cover; border-radius: 2px; display: block; }
.evp__fig figcaption { font-size: 14px; line-height: 1.4; align-self: start; }
.evp__fig figcaption .src { color: var(--grey); display: block; margin-top: 8px; }
.evp__ph { display: block; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 14px; color: var(--grey); }
.evp__thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.evp__thumbs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 2px; }

.note { margin: 0 var(--edge); padding: 0 0 40px; font-size: 13px; color: var(--grey); }

/* ---------- Mobile (Figma has no mobile frame here; stacked as on the other pages) ---------- */
@media (max-width: 960px) {
  :root { --hdr: 56px; --bar: auto; --edge: 16px; }
  .nav__logo img { content: url("assets/web/logo-mobile-dark.png"); height: 30px; }
  .bar__in { flex-wrap: wrap; height: auto; gap: 8px; padding: 10px 0; }
  .search { width: 100%; }
  .bar__right { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .axis { display: none; }
  .per__row { height: auto; min-height: 56px; }
  .per__dates { opacity: 1; transform: none; font-size: 14px; }
  .per__name { font-size: 24px; white-space: normal; }
  .per__band { display: none; }
  .per__text { padding-left: 0; }
  .per__body { grid-template-columns: 1fr; gap: 20px; }
  .ev { grid-template-columns: minmax(0, 1fr) 37px; row-gap: 4px; }
  .ev__d { grid-column: 1 / -1; font-size: 13px; }
  .ev__mark { display: none; }
  .ev__t { font-size: 16px; }
  .ev--main .ev__t, .ev--xl .ev__t { font-size: 22px; }
  .head { grid-template-columns: 1fr; row-gap: 24px; padding-top: 36px; }
  .head h1 { font-size: 32px; }
  .filters__grid { grid-template-columns: 1fr; }
  .filters__grid > .fgroup { padding: 0; border-left: 0; }
  .panel__in { padding: 22px 20px 32px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* Filters: full-height panel, four columns, dropdowns, footer pinned to the bottom */
.filters { top: 0; right: 0; height: 100dvh; width: min(1280px, 100%); }
.filters .panel__in { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 24px 28px 0; }
.filters h2 { font-size: 40px; line-height: 1.1; margin: 8px 0 28px; }
.filters__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; flex: 1; min-height: 0; overflow: auto; }
.filters__grid > .fgroup { padding: 0 20px; border-left: 1px solid var(--rule); }
.filters__grid > .fgroup:first-child { padding-left: 0; border-left: 0; }
.fgroup h3 { font-size: 24px; font-weight: 400; color: var(--ink); margin: 0 0 16px; }
.fgroup ul { margin: 0; }
.fgroup .all { text-transform: uppercase; font-size: 14px; letter-spacing: .02em; border-bottom: 1px solid var(--rule); padding: 0 0 12px; margin-bottom: 8px; }
.fgroup li > .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fgroup li > .row label { flex: 1; min-width: 0; }
.fgroup .tail { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.fgroup .n { font-size: 14px; }
.fgroup .chev { width: 24px; height: 24px; border: 0; background: none; cursor: pointer; padding: 0; position: relative; }
.fgroup .chev::before { content: ""; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(45deg); transition: transform .2s var(--ease); }
.fgroup .chev.is-open::before { transform: rotate(-135deg); top: 10px; }
.fgroup ul.sub { padding-left: 24px; margin-top: 4px; }
.fgroup ul.sub[hidden] { display: none; }
.filters__act { flex-shrink: 0; margin: 0 -28px; padding: 20px 28px 24px; display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); background: var(--paper); }
.filters__act .btn { min-width: 200px; }


/* Timeline: bars across the full width, behind the title */
.tl { position: relative; min-height: 40px; border-top: 1px solid var(--rule); }
.tl:last-child { border-bottom: 1px solid var(--rule); }
.tl__track { position: absolute; left: 0; right: 0; top: 2px; bottom: 2px; }
.tl__track i { position: absolute; top: 0; bottom: 0; background: var(--hl); transition: background-color .3s var(--ease); }
.tl__lead { position: relative; z-index: 1; display: grid; grid-template-columns: 28px 84px minmax(0, 420px); gap: 8px; align-items: center; padding: 6px 0; pointer-events: none; }
.tl__thumb img { width: 28px; height: 28px; object-fit: cover; display: block; }
.tl__y { font-size: 12px; line-height: 16px; color: var(--grey); white-space: nowrap; }
.tl__name { display: block; font-size: 13px; line-height: 16px; white-space: normal; }
.tl__cat { display: block; font-size: 11px; line-height: 14px; color: var(--grey); white-space: normal; }
.tl:hover .tl__track i { background: #3d9a78; }
/* Grid */
.gwrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 40px; align-items: start; }
.gcats { list-style: none; margin: 0; padding: 0; position: sticky; top: 160px; }
.gcats li + li { margin-top: 12px; }
.gcat { all: unset; cursor: pointer; font-size: 12px; line-height: 1.3; color: var(--grey); transition: color .2s var(--ease); }
.gcat:hover { color: var(--hl); }
.gcat.is-on { color: var(--ink); }
.ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.gcard { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 16px; align-items: start; padding: 16px 0; border-top: 1px solid var(--rule); text-decoration: none; color: inherit; }
.gcard__t { display: block; font-size: 22px; line-height: 1.15; transition: color .2s var(--ease); }
.gcard__y { display: block; font-size: 13px; color: var(--grey); margin-top: 6px; }
.gcard img { width: 140px; height: 100px; object-fit: cover; display: block; }
.gcard:hover .gcard__t { color: var(--hl); text-decoration: underline; text-underline-offset: 3px; }
.gcard:hover img { opacity: .85; }
@media (max-width: 960px) { .gwrap { grid-template-columns: 1fr; } .ggrid { grid-template-columns: 1fr; } .gcats { position: static; } }

/* Timeline rows: years on hover, + to open the details, as in the periods */
.tl__head { position: relative; min-height: 40px; }
.tl__head .tl__track { position: absolute; left: 0; right: 0; top: 2px; bottom: 2px; }
.tl__y { opacity: 0; transition: opacity .3s var(--ease); }

    var cards = themes.filter(function (t) { return !gridCat || t.cat === gridCat; }).map(function (t) {
      return '<a class="gcard" href="#"><span class="gcard__txt"><span class="gcard__t">' + h(t.name) + '</span><span class="gcard__y">' + h(t.years) + '</span></span>' +
        '<img src="' + t.img + '" alt=""></a>';
    }).join('');
    return '<div class="gwrap">' + side + '<div class="ggrid">' + cards + '</div></div>';
  }
  $('#list').addEventListener('click', function (ev) {
    var b = ev.target.closest('.gcat');
    if (!b) return;
    gridCat = b.getAttribute('data-cat') || null;
    render();
  });
  document.querySelectorAll('.seg__btn').forEach(function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      document.querySelectorAll('.seg__btn').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });

  /* ---------- Event panel ---------- */
  var lastFocus = null;
  function openEvent(id, from) {
    var e = events.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    lastFocus = from || null;
    $('#evp-date').textContent = e.pe ? e.pd + ' — ' + e.pe : e.pd;
    $('#evp-title').textContent = e.title;
    var meta = { Location: (e.meta && e.meta.Location) || 'Placeholder', Actors: 'Placeholder', Subjects: 'Placeholder' };
    $('#evp-meta').innerHTML = Object.keys(meta).map(function (k) {
      return '<div><dt>' + h(k) + '</dt><dd>' + meta[k].split(', ').map(function (v) { return '<a href="#">' + h(v) + '</a>'; }).join(', ') + '</dd></div>';
    }).join('');
    $('#evp-text').innerHTML = '<p>' + h(PLACE) + '</p><p>' + h(PLACE) + '</p>';
    $('#evp-fig').innerHTML = '<div><img src="' + (e.img || PLACEHOLDER_IMG) + '" alt=""></div><figcaption>Title. Caption that can long. Location name (YYYY).<span class="src">Source name. Author name</span></figcaption>';
    var rel = [];
    if (e.prev && byId[e.prev]) rel.push({ icon: ICON_UP, ev: byId[e.prev] });
    if (e.next && byId[e.next]) rel.push({ icon: ICON_DOWN, ev: byId[e.next] });
    $('#evp-related').innerHTML = rel.map(function (r) {
      return '<a class="rel rel--ic" href="#" data-event="' + r.ev.id + '"><span class="rel__ic">' + r.icon + '</span><span><span class="rel__d">' + h(r.ev.pd) + '</span><span class="rel__t">' + h(r.ev.title) + '</span></span></a>';
    }).join('');
    $('#evp-thematic').innerHTML = '<h3>Related Thematic Chronologies</h3>' +
      '<a class="thm" href="#"><img src="' + PLACEHOLDER_IMG + '" alt=""><span class="evp__y">1915–1954</span><span class="evp__t">Placeholder thematic chronology title</span></a>';
    $('#evp-highlights').innerHTML = highlights.map(function (x) {
      return '<a class="hl" href="#"><img src="' + x.img + '" alt=""><span><span class="hl__t">' + h(x.t) + '</span><span class="hl__s">' + h(x.s) + '</span></span></a>';
    }).join('');
    var row = function (img, year, title, sub) {
      return '<a class="evp__row" href="#">' + (img ? '<img src="' + img + '" alt="">' : '<span></span>') +
        '<span>' + (year ? '<span class="evp__y">' + h(year) + '</span>' : '') + '<span class="evp__t">' + h(title) + '</span>' +
        (sub ? '<span class="evp__sub">' + h(sub) + '</span>' : '') + '</span></a>';
    };
    var txt = function (year, title) {
      return '<a class="evp__txt" href="#"><span class="evp__y">' + h(year) + '</span><span class="evp__t">' + h(title) + '</span></a>';
    };
    var place = function (cat, name, where) {
      return '<a class="evp__place" href="#"><span class="evp__cat">' + h(cat) + '</span><span><span class="evp__t">' + h(name) + '</span><span class="evp__sub">' + h(where) + '</span></span></a>';
    };
    $('#evp-extra').innerHTML =
      '<h3>Related Places</h3>' +
        place('Village', 'Placeholder place', 'Placeholder region') +
        place('Camp', 'Placeholder place', 'Placeholder region') +
      '<h3>Related Texts</h3>' +
        txt('1897', 'Placeholder text title') + txt('1897', 'Placeholder text title') +
        txt('1923', 'Placeholder text title') + txt('1903', 'Placeholder text title') +
      '<h3>Related Maps</h3>' +
        row(PLACEHOLDER_IMG, '1943', 'Placeholder map title', 'Placeholder source') +
      '<h3>Related Illustrations</h3>' +
        row(PLACEHOLDER_IMG, '1965', 'Placeholder illustration title', 'Author name');
    closeFilters();
    panel('#event', true);
  }

  /* ---------- Filters ---------- */
  function box(name, count) {
    return '<label><input type="checkbox"> ' + h(name) + '</label>';
  }
  function tail(count, kids) {
    return '<span class="tail">' + (count != null ? '<span class="n">' + count + '</span>' : '') +
      (kids ? '<button class="chev" type="button" aria-expanded="false" aria-label="Show sub-items"></button>' : '') + '</span>';
  }
  $('#filter-groups').innerHTML = filterGroups.map(function (g) {
    return '<div class="fgroup"><h3>' + h(g.title) + '</h3><ul>' +
      '<li><label class="all"><input type="checkbox" data-all> Select all</label></li>' +
      g.items.map(function (it) {
        var kids = it[2] ? '<ul class="sub" hidden>' + [1, 2, 3].map(function (k) {
          return '<li><div class="row">' + box('Placeholder sub-item ' + k) + tail(10, false) + '</div></li>';
        }).join('') + '</ul>' : '';
        return '<li><div class="row">' + box(it[0]) + tail(it[1], !!it[2]) + '</div>' + kids + '</li>';
      }).join('') +
      '</ul></div>';
  }).join('');
  $('#filter-groups').addEventListener('click', function (ev) {
    var c = ev.target.closest('.chev');
    if (!c) return;
    var li = c.closest('li');
    var sub = li.querySelector(':scope > ul.sub');
    var open = sub.hidden;
    sub.hidden = !open;
    c.setAttribute('aria-expanded', String(open));
    c.classList.toggle('is-open', open);
  });
  $('#filter-groups').addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-all')) {
      t.closest('.fgroup').querySelectorAll('input:not([data-all])').forEach(function (b) { b.checked = t.checked; });
      return;
    }
    var li = t.closest('li');
    if (li) li.querySelectorAll(':scope > ul.sub input').forEach(function (b) { b.checked = t.checked; });
  });
  $('#reset-filters').addEventListener('click', function () {
    document.querySelectorAll('#filters input').forEach(function (b) { b.checked = false; });
  });

  /* ---------- Panels: open, close on outside click, Close button, Escape ---------- */
  function panel(sel, open) {
    var p = $(sel);
    p.classList.toggle('is-open', open);
    p.setAttribute('aria-hidden', String(!open));
  }
  function closeFilters() { panel('#filters', false); $('#open-filters').setAttribute('aria-expanded', 'false'); }
  function closeEvent() { panel('#event', false); if (lastFocus) lastFocus.focus(); }
  $('#open-filters').addEventListener('click', function () {
    var open = !$('#filters').classList.contains('is-open');
    if (open) panel('#event', false);
    panel('#filters', open);
    this.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('.panel [data-close]').forEach(function (b) {
    b.addEventListener('click', function () { if (b.closest('#event')) closeEvent(); else closeFilters(); });
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if ($('#event').classList.contains('is-open') && !$('#event').contains(t) && !t.closest('.ev')) closeEvent();
    if ($('#filters').classList.contains('is-open') && !$('#filters').contains(t) && !t.closest('#open-filters')) closeFilters();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if ($('#event').classList.contains('is-open')) closeEvent();
    if ($('#filters').classList.contains('is-open')) closeFilters();
  });

  render();
})();
</script>
</body>
</html>
